<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BlaBlaPague — Entrar</title>
  <link rel="stylesheet" href="css/styles.css?v=34" />
  <style>
    .login-wrap { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem; }
    .login-card { background: #fff; color: var(--texto); border-radius: 26px; width: min(460px, 96vw);
      padding: 2rem 1.8rem; box-shadow: var(--sombra); text-align: center; }
    .login-emoji { font-size: 3rem; }
    .login-card h1 { font-size: 1.7rem; margin: 0.3rem 0 0.2rem; }
    .login-card p.sub { color: var(--texto-suave); margin: 0 0 1.4rem; font-size: 1rem; line-height: 1.4; }
    .login-card label { display: block; text-align: left; font-weight: 700; font-size: 0.82rem; color: var(--texto-suave); margin: 0 0 0.35rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .login-card input { width: 100%; padding: 0.85rem 0.9rem; border: 1px solid #dde3ef; border-radius: 12px; font-size: 1.05rem; }
    .login-card .btn { width: 100%; margin-top: 1rem; font-size: 1.1rem; padding: 0.9rem; }
    .login-msg { margin-top: 1rem; font-size: 0.95rem; border-radius: 12px; padding: 0.8rem; display: none; }
    .login-msg.ok { display: block; background: #e8f8f0; color: var(--verde-esc); }
    .login-msg.erro { display: block; background: #fdeaea; color: #b91c1c; }
    .login-ok-box { display: none; }
    .login-ok-box.on { display: block; }
    .login-form.off { display: none; }
    .login-rodape { margin-top: 1.4rem; font-size: 0.82rem; color: var(--texto-suave); }
    .login-rodape a { color: var(--azul-esc); }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-emoji">🚗💸</div>
      <h1>BlaBlaPague</h1>
      <p class="sub">Entre com seu e-mail pra configurar seu kiosk. Enviamos um <b>link mágico</b> — sem senha.</p>

      <form class="login-form" id="loginForm">
        <label for="email">Seu e-mail</label>
        <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="voce@email.com" required />
        <button class="btn btn-verde" id="btnEnviar" type="submit">✉️ Enviar link de acesso</button>
      </form>

      <div class="login-ok-box" id="okBox">
        <div class="login-emoji">📬</div>
        <h1 style="font-size:1.3rem">Olha seu e-mail!</h1>
        <p class="sub" id="okEmail"></p>
        <p class="sub" style="font-size:0.9rem">Abra o link no <b>mesmo aparelho</b> pra entrar. Não chegou? Veja o spam ou
          <a href="#" id="tentarDeNovo">tente de novo</a>.</p>
      </div>

      <div class="login-msg" id="msg"></div>

      <div class="login-rodape">
        Só pra configurar (motorista). Os passageiros não precisam entrar. <br>
        <a href="index.html">← Voltar ao kiosk</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js?v=34"></script>
  <script src="js/supa.js?v=34"></script>
  <script src="js/login.js?v=34"></script>
</body>
</html>
